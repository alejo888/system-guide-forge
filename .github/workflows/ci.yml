name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: systemguideforge_ci
          POSTGRES_USER: systemguideforge_ci
          POSTGRES_PASSWORD: systemguideforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U systemguideforge_ci -d systemguideforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -q '^0\{40\}$'; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id -r "$HEAD_SHA"
          fi

      - name: Install Playwright Chromium
        working-directory: backend
        run: >-
          ./mvnw org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run backend tests
        working-directory: backend
        env:
          SGF_DB_URL: jdbc:postgresql://127.0.0.1:5432/systemguideforge_ci
          SGF_DB_USERNAME: systemguideforge_ci
          SGF_DB_PASSWORD: systemguideforge_ci_password
          SGF_CREDENTIAL_KEY: ci-ephemeral-credential-key
        run: ./mvnw test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run fixture smoke test
        working-directory: test-target
        run: npm test

      - name: Build backend for E2E
        working-directory: backend
        run: ./mvnw -DskipTests package

      - name: Start E2E fixture and backend
        env:
          SGF_DB_URL: jdbc:postgresql://127.0.0.1:5432/systemguideforge_ci
          SGF_DB_USERNAME: systemguideforge_ci
          SGF_DB_PASSWORD: systemguideforge_ci_password
          SGF_CREDENTIAL_KEY: ci-ephemeral-credential-key
          SGF_BACKEND_URL: http://127.0.0.1:8080
          SGF_FIXTURE_URL: http://127.0.0.1:4173
          FIXTURE_USERNAME: fixture-user
          FIXTURE_PASSWORD: fixture-password
        run: |
          nohup node test-target/server.js > fixture.log 2>&1 &
          echo $! > fixture.pid
          nohup java -jar backend/target/backend-0.1.0-SNAPSHOT.jar > backend.log 2>&1 &
          echo $! > backend.pid
          for attempt in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/projects || true)"
            if [ "$status" = "405" ]; then break; fi
            sleep 1
          done
          test "$status" = "405"
          curl --fail --silent http://127.0.0.1:4173/login.html > /dev/null

      - name: Run backend E2E
        working-directory: test-target
        env:
          SGF_BACKEND_URL: http://127.0.0.1:8080
          SGF_FIXTURE_URL: http://127.0.0.1:4173
          FIXTURE_USERNAME: fixture-user
          FIXTURE_PASSWORD: fixture-password
        run: npm run e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            backend.log
            fixture.log
          if-no-files-found: ignore
