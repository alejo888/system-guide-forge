services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: systemguideforge
      POSTGRES_USER: systemguideforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - systemguideforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemguideforge -d systemguideforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  systemguideforge-postgres-data:
