services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: systemguideforge
      POSTGRES_USER: systemguideforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - systemguideforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemguideforge -d systemguideforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full stack: `docker compose --profile app up -d --build`. Without the profile only Postgres starts.
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      SGF_DB_URL: jdbc:postgresql://postgres:5432/systemguideforge
      SGF_DB_USERNAME: systemguideforge
      SGF_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Must match the key that encrypted the credentials already stored in the database. Not `:?`: Compose
      # interpolates every service even outside the active profile, and the backend refuses to start without a key.
      SGF_CREDENTIAL_KEY: ${SGF_CREDENTIAL_KEY:-}
      # Lets targets on the host be registered as http://host.docker.internal:<port>.
      SGF_ALLOW_DOCKER_HOST: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chromium needs more than the default 64 MB /dev/shm.
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
    # Bounded so a fatal startup error does not restart forever: a missing SGF_CREDENTIAL_KEY makes the backend
    # exit. Check `docker compose logs backend`.
    restart: on-failure:3

  frontend:
    profiles: ["app"]
    build: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      # Hostnames nginx answers for; any other Host is dropped (DNS rebinding protection).
      SERVER_NAMES: ${SGF_SERVER_NAMES:-localhost 127.0.0.1}
    ports:
      - "127.0.0.1:${SGF_WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  systemguideforge-postgres-data:
