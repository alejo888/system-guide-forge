openapi: 3.1.0
info:
  title: SystemGuideForge API
  version: 0.1.0
  description: API implementada para registrar sistemas web locales y probar su acceso autenticado de forma segura.

servers:
  - url: http://localhost:8080/api

tags:
  - name: Projects
    description: Projects configured in the personal workspace.
  - name: Applications
    description: Local web systems registered for analysis.

paths:
  /projects:
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/applications:
    post:
      tags: [Applications]
      summary: Register a local web system
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Application registered.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}:
    get:
      tags: [Applications]
      summary: Get a registered application
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application found. Credentials are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/test-access:
    post:
      tags: [Applications]
      summary: Test local access with traditional username/password authentication
      description: >-
        Opens an isolated Playwright browser context, navigates to the configured
        login URL, and attempts the configured username/password login. Credentials
        are never returned. The current MVP accepts only local targets and fails
        closed when browser automation is unavailable or the login cannot be verified.
      operationId: testApplicationAccess
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Access test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTestResult'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request validation failed or target URL is outside the local MVP scope.
    NotFound:
      description: Resource not found.

  schemas:
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ProjectResponse:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ApplicationInput:
      type: object
      additionalProperties: false
      required: [name, baseUrl, loginUrl, username, password]
      properties:
        name:
          type: string
          minLength: 1
        baseUrl:
          type: string
          format: uri
          description: Local base URL, such as http://localhost:3000.
        loginUrl:
          type: string
          format: uri
          description: Local login form URL.
        username:
          type: string
          minLength: 1
          writeOnly: true
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true

    ApplicationResponse:
      type: object
      additionalProperties: false
      required: [id, projectId, name, baseUrl, loginUrl]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        loginUrl:
          type: string
          format: uri

    AccessTestResult:
      type: object
      additionalProperties: false
      required: [reachable, authenticated]
      properties:
        reachable:
          type: boolean
        authenticated:
          type: boolean
        message:
          type: string
